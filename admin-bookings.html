<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings Management | Pearl Safari Uganda Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --forest: #2d543a;
      --forest-light: #4a7c59;
      --forest-mid: #1f3d2a;
      --gold: #d4af37;
      --cream: #fdf9f3;
      --cream-dark: #f5ede3;
      --text-main: #2a2a2a;
      --text-soft: #666;
      --white: #ffffff;
      --danger: #e74c3c;
      --success: #27ae60;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    body {
      font-family: 'DM Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--cream);
      color: var(--text-main);
    }

    .admin-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .admin-sidebar {
      background: var(--forest);
      color: white;
      padding: 2rem 0;
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      z-index: 1000;
    }

    .admin-logo {
      padding: 0 1.5rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .admin-nav {
      padding: 1.5rem 0;
    }

    .admin-nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .admin-nav-item:hover,
    .admin-nav-item.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--gold);
    }

    .admin-nav-item i {
      width: 24px;
      text-align: center;
    }

    .admin-nav-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      padding: 1rem 1.5rem 0.5rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .admin-logout {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .admin-main {
      margin-left: 280px;
      padding: 2rem;
      background: var(--cream);
    }

    .admin-header {
      background: white;
      padding: 1.5rem 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    .admin-header h1 {
      font-size: 1.8rem;
      color: var(--forest);
    }

    .filter-bar {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .filter-bar input,
    .filter-bar select {
      padding: 0.75rem;
      border: 2px solid var(--cream-dark);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
    }

    .filter-bar input:focus,
    .filter-bar select:focus {
      outline: none;
      border-color: var(--forest);
    }

    .section-card {
      background: white;
      padding: 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.3rem;
      color: var(--forest);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: var(--cream-dark);
      padding: 1rem;
      text-align: left;
      font-weight: 600;
      color: var(--forest);
      font-size: 0.9rem;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--cream-dark);
    }

    tr:hover {
      background: var(--cream);
    }

    .status-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #d4edda; color: #155724; }
    .status-completed { background: #cfe2ff; color: #084298; }
    .status-cancelled { background: #f8d7da; color: #721c24; }

    .action-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .btn-small {
      padding: 0.5rem 1rem;
      background: var(--forest);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-small:hover {
      background: var(--forest-mid);
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .btn-logout {
      background: var(--danger);
    }

    .btn-logout:hover {
      background: #c0392b;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: white;
      margin: 5% auto;
      padding: 2rem;
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--cream-dark);
      padding-bottom: 1rem;
    }

    .modal-header h2 {
      color: var(--forest);
    }

    .close {
      color: var(--text-soft);
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: var(--text-main);
    }

    .modal-body {
      margin-bottom: 1.5rem;
    }

    .modal-footer {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--forest);
      font-weight: 600;
    }

    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid var(--cream-dark);
      border-radius: var(--radius-md);
      font-size: 1rem;
    }

    .form-group select:focus {
      outline: none;
      border-color: var(--forest);
    }

    @media (max-width: 768px) {
      .admin-layout {
        grid-template-columns: 1fr;
      }

      .admin-sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }

      .admin-main {
        margin-left: 0;
      }

      .filter-bar {
        flex-direction: column;
      }

      .action-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="admin-layout">
  <!-- SIDEBAR -->
  <div class="admin-sidebar">
    <div class="admin-logo">
      <i class="fas fa-paw"></i>
      Pearl Safari
    </div>

    <div class="admin-nav-label">Main</div>
    <a href="admin-dashboard.html" class="admin-nav-item">
      <i class="fas fa-chart-line"></i>
      <span>Dashboard</span>
    </a>

    <div class="admin-nav-label">Manage</div>
    <a href="admin-bookings.html" class="admin-nav-item active">
      <i class="fas fa-calendar-check"></i>
      <span>Bookings</span>
    </a>
    <a href="admin-payments.html" class="admin-nav-item">
      <i class="fas fa-credit-card"></i>
      <span>Payments</span>
    </a>
    <a href="admin-messages.html" class="admin-nav-item">
      <i class="fas fa-envelope"></i>
      <span>Messages</span>
    </a>
    <a href="admin-users.html" class="admin-nav-item">
      <i class="fas fa-users"></i>
      <span>Users</span>
    </a>

    <div class="admin-nav-label">Settings</div>
    <div class="admin-nav-item admin-logout" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="admin-main">
    <div class="admin-header">
      <h1><i class="fas fa-calendar-check"></i> Bookings Management</h1>
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search by reference, email, or name...">
        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="PENDING">Pending</option>
          <option value="CONFIRMED">Confirmed</option>
          <option value="COMPLETED">Completed</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
        <button class="btn-small" onclick="loadBookings()">Search</button>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title">
        <i class="fas fa-list"></i>
        All Bookings
      </div>
      <div class="table-responsive">
        <table id="bookingsTable">
          <thead>
            <tr>
              <th>Reference</th>
              <th>Customer</th>
              <th>Email</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-soft);">
                Loading bookings...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- MODAL FOR BOOKING DETAILS -->
<div id="bookingModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Booking Details</h2>
      <span class="close" onclick="closeBookingModal()">&times;</span>
    </div>
    <div class="modal-body" id="bookingDetails">
      Loading...
    </div>
    <div class="modal-footer">
      <button class="btn-small" onclick="closeBookingModal()">Close</button>
    </div>
  </div>
</div>

<!-- MODAL FOR STATUS UPDATE -->
<div id="statusModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Update Booking Status</h2>
      <span class="close" onclick="closeStatusModal()">&times;</span>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="newStatus">New Status</label>
        <select id="newStatus">
          <option value="PENDING">Pending</option>
          <option value="CONFIRMED">Confirmed</option>
          <option value="COMPLETED">Completed</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-small" onclick="closeStatusModal()">Cancel</button>
      <button class="btn-small" style="background: var(--success);" onclick="updateBookingStatus()">Update</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:5000/api';
  let currentBookingId = null;

  function checkAuth() {
    const token = localStorage.getItem('adminToken');
    if (!token) {
      window.location.href = 'admin-login.html';
    }
  }

  async function loadBookings() {
    try {
      const token = localStorage.getItem('adminToken');
      const search = document.getElementById('searchInput').value;
      const status = document.getElementById('statusFilter').value;

      let url = `${API_BASE}/admin/bookings?skip=0&take=20`;
      if (search) url += `&search=${encodeURIComponent(search)}`;
      if (status) url += `&status=${status}`;

      const response = await fetch(url, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) {
        if (response.status === 401 || response.status === 403) {
          window.location.href = 'admin-login.html';
          return;
        }
        throw new Error('Failed to load bookings');
      }

      const data = await response.json();
      updateBookingsTable(data.bookings);
    } catch (error) {
      console.error('Load error:', error);
      alert('Failed to load bookings');
    }
  }

  function updateBookingsTable(bookings) {
    const tbody = document.querySelector('#bookingsTable tbody');
    
    if (!bookings || bookings.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-soft);">No bookings found</td></tr>';
      return;
    }

    tbody.innerHTML = bookings.map(booking => `
      <tr>
        <td><strong>${booking.bookingReference}</strong></td>
        <td>${booking.firstName} ${booking.lastName}</td>
        <td>${booking.email}</td>
        <td>$${Number(booking.totalAmount).toLocaleString('en-US', { maximumFractionDigits: 2 })}</td>
        <td><span class="status-badge status-${booking.status.toLowerCase()}">${booking.status}</span></td>
        <td>${new Date(booking.createdAt).toLocaleDateString()}</td>
        <td>
          <div class="action-buttons">
            <button class="btn-small" onclick="viewBookingDetails(${booking.id})">View</button>
            <button class="btn-small" onclick="openStatusModal(${booking.id})">Change Status</button>
            <button class="btn-small btn-danger" onclick="deleteBooking(${booking.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  async function viewBookingDetails(bookingId) {
    try {
      const token = localStorage.getItem('adminToken');
      const response = await fetch(`${API_BASE}/admin/bookings/${bookingId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) throw new Error('Failed to load booking');

      const booking = await response.json();
      displayBookingDetails(booking);
      document.getElementById('bookingModal').style.display = 'block';
    } catch (error) {
      alert('Failed to load booking details');
    }
  }

  function displayBookingDetails(booking) {
    const html = `
      <div style="display: grid; gap: 1rem;">
        <div>
          <strong>Reference:</strong> ${booking.bookingReference}
        </div>
        <div>
          <strong>Customer:</strong> ${booking.firstName} ${booking.lastName}
        </div>
        <div>
          <strong>Email:</strong> ${booking.email}
        </div>
        <div>
          <strong>Phone:</strong> ${booking.phone}
        </div>
        <div>
          <strong>Nationality:</strong> ${booking.nationality || 'N/A'}
        </div>
        <div>
          <strong>Travel Date:</strong> ${booking.travelDate ? new Date(booking.travelDate).toLocaleDateString() : 'N/A'}
        </div>
        <div>
          <strong>Adults/Children:</strong> ${booking.adults}/${booking.children}
        </div>
        <div>
          <strong>Total Amount:</strong> $${Number(booking.totalAmount).toLocaleString('en-US', { maximumFractionDigits: 2 })} ${booking.currency}
        </div>
        <div>
          <strong>Payment Method:</strong> ${booking.paymentMethod}
        </div>
        <div>
          <strong>Status:</strong> <span class="status-badge status-${booking.status.toLowerCase()}">${booking.status}</span>
        </div>
        <div>
          <strong>Special Requests:</strong> ${booking.specialRequests || 'None'}
        </div>
        <div>
          <strong>Created:</strong> ${new Date(booking.createdAt).toLocaleString()}
        </div>
        ${booking.payments && booking.payments.length > 0 ? `
          <div>
            <strong>Payments:</strong>
            <ul>
              ${booking.payments.map(p => `<li>$${Number(p.amount).toLocaleString('en-US', { maximumFractionDigits: 2 })} - ${p.status}</li>`).join('')}
            </ul>
          </div>
        ` : ''}
      </div>
    `;
    document.getElementById('bookingDetails').innerHTML = html;
  }

  function openStatusModal(bookingId) {
    currentBookingId = bookingId;
    document.getElementById('statusModal').style.display = 'block';
  }

  async function updateBookingStatus() {
    try {
      const token = localStorage.getItem('adminToken');
      const status = document.getElementById('newStatus').value;

      const response = await fetch(`${API_BASE}/admin/bookings/${currentBookingId}/status`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ status })
      });

      if (!response.ok) throw new Error('Failed to update status');

      alert('Booking status updated successfully');
      closeStatusModal();
      loadBookings();
    } catch (error) {
      alert('Failed to update status');
    }
  }

  async function deleteBooking(bookingId) {
    if (!confirm('Are you sure you want to delete this booking?')) return;

    try {
      const token = localStorage.getItem('adminToken');
      const response = await fetch(`${API_BASE}/admin/bookings/${bookingId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) throw new Error('Failed to delete booking');

      alert('Booking deleted successfully');
      loadBookings();
    } catch (error) {
      alert('Failed to delete booking');
    }
  }

  function closeBookingModal() {
    document.getElementById('bookingModal').style.display = 'none';
  }

  function closeStatusModal() {
    document.getElementById('statusModal').style.display = 'none';
  }

  function logout() {
    if (confirm('Are you sure you want to logout?')) {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminUser');
      window.location.href = 'admin-login.html';
    }
  }

  // Close modal when clicking outside
  window.onclick = function(event) {
    if (event.target.classList.contains('modal')) {
      event.target.style.display = 'none';
    }
  }

  // Initialize
  checkAuth();
  loadBookings();
</script>

</body>
</html>
