<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Pearl Safari Uganda</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="api-config.js"></script>
  <style>
    .admin-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--forest) 0%, var(--forest-mid) 100%);
      padding: 1rem;
    }

    .login-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 3rem;
      width: 100%;
      max-width: 420px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-header .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      color: var(--forest);
      margin-bottom: 1rem;
    }

    .login-header h1 {
      font-size: 1.8rem;
      color: var(--forest);
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: var(--text-soft);
      font-size: 0.9rem;
    }

    .form-field {
      margin-bottom: 1.5rem;
    }

    .form-field label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--forest);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-field input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid var(--cream-dark);
      border-radius: var(--radius-md);
      font-size: 1rem;
      transition: all 0.2s;
    }

    .form-field input:focus {
      outline: none;
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(45, 84, 58, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 0.875rem;
      background: var(--forest);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-login:hover {
      background: var(--forest-mid);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(45, 84, 58, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee;
      color: #c00;
      padding: 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      display: none;
      border-left: 4px solid #c00;
    }

    .success-message {
      background: #efe;
      color: #060;
      padding: 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      display: none;
      border-left: 4px solid #060;
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }

    .back-link a {
      color: var(--forest);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .back-link a:hover {
      color: var(--forest-mid);
    }

    @media (max-width: 600px) {
      .login-card {
        padding: 2rem;
      }

      .login-header h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

<div class="admin-login">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <i class="fas fa-user-shield"></i>
        Pearl Safari
      </div>
      <h1>Admin Login</h1>
      <p>Access your administration panel</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm">
      <div class="form-field">
        <label for="email">Admin Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="admin@pearlsafari.ug"
          required
        >
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i>
        <span>Login to Dashboard</span>
      </button>
    </form>

    <div class="back-link">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>
  </div>
</div>

<script>
const API_BASE = window.API_BASE;

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const loginBtn = document.getElementById('loginBtn');
  const errorDiv = document.getElementById('errorMessage');
  const successDiv = document.getElementById('successMessage');

  // Hide previous messages
  errorDiv.style.display = 'none';
  successDiv.style.display = 'none';

  if (!email || !password) {
    showError('Please fill in all fields.');
    return;
  }

  loginBtn.classList.add('loading');
  loginBtn.disabled = true;

  try {
    const response = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || 'Login failed');
    }

    // Check if user is admin
    if (data.user && data.user.role === 'ADMIN') {
      // Store admin token
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminUser', JSON.stringify(data.user));

      showSuccess('Login successful! Redirecting...');
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 1500);
    } else {
      throw new Error('Only admins can access this panel.');
    }
  } catch (error) {
    showError(error.message);
  } finally {
    loginBtn.classList.remove('loading');
    loginBtn.disabled = false;
  }
});

function showError(message) {
  const errorDiv = document.getElementById('errorMessage');
  errorDiv.textContent = message;
  errorDiv.style.display = 'block';
}

function showSuccess(message) {
  const successDiv = document.getElementById('successMessage');
  successDiv.textContent = message;
  successDiv.style.display = 'block';
}
</script>

</body>
</html>
