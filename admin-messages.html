<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | Pearl Safari Uganda Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --forest: #2d543a; --forest-light: #4a7c59; --forest-mid: #1f3d2a;
      --gold: #d4af37; --cream: #fdf9f3; --cream-dark: #f5ede3;
      --text-main: #2a2a2a; --text-soft: #666; --white: #ffffff;
      --danger: #e74c3c; --success: #27ae60;
      --radius-md: 8px; --radius-lg: 12px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1); --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    body { font-family: 'DM Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--cream); color: var(--text-main); }
    .admin-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .admin-sidebar { background: var(--forest); color: white; padding: 2rem 0; position: fixed; left: 0; top: 0; width: 280px; height: 100vh; overflow-y: auto; box-shadow: var(--shadow-lg); z-index: 1000; }
    .admin-logo { padding: 0 1.5rem 2rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 0.75rem; font-size: 1.3rem; font-weight: 700; }
    .admin-nav-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem; color: rgba(255, 255, 255, 0.7); cursor: pointer; transition: all 0.3s; text-decoration: none; }
    .admin-nav-item:hover, .admin-nav-item.active { background: rgba(255, 255, 255, 0.1); color: var(--gold); }
    .admin-nav-item i { width: 24px; text-align: center; }
    .admin-nav-label { font-size: 0.75rem; color: rgba(255, 255, 255, 0.5); padding: 1rem 1.5rem 0.5rem; text-transform: uppercase; font-weight: 600; }
    .admin-logout { margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .admin-main { margin-left: 280px; padding: 2rem; background: var(--cream); }
    .admin-header { background: white; padding: 1.5rem 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow); margin-bottom: 2rem; }
    .admin-header h1 { font-size: 1.8rem; color: var(--forest); }
    .section-card { background: white; padding: 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    .section-title { font-size: 1.3rem; color: var(--forest); margin-bottom: 1.5rem; }
    .message-item { background: var(--cream); padding: 1.5rem; border-radius: var(--radius-lg); margin-bottom: 1rem; border-left: 4px solid var(--gold); cursor: pointer; transition: all 0.2s; }
    .message-item:hover { transform: translateX(4px); }
    .message-item.unread { background: #fffbf0; border-left-color: var(--forest); }
    .message-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem; }
    .message-from { font-weight: 600; color: var(--forest); }
    .message-time { font-size: 0.85rem; color: var(--text-soft); }
    .message-subject { font-weight: 500; color: var(--text-main); margin-bottom: 0.5rem; }
    .message-preview { color: var(--text-soft); font-size: 0.9rem; }
    .btn-small { padding: 0.5rem 1rem; background: var(--forest); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .btn-small:hover { background: var(--forest-mid); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #c0392b; }
    .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); }
    .modal-content { background-color: white; margin: 5% auto; padding: 2rem; border-radius: var(--radius-lg); width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 2px solid var(--cream-dark); padding-bottom: 1rem; }
    .modal-header h2 { color: var(--forest); }
    .close { color: var(--text-soft); font-size: 28px; font-weight: bold; cursor: pointer; }
    .close:hover { color: var(--text-main); }
    .modal-footer { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem; }
    @media (max-width: 768px) {
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { width: 100%; height: auto; position: relative; }
      .admin-main { margin-left: 0; }
    }
  </style>
</head>
<body>

<div class="admin-layout">
  <div class="admin-sidebar">
    <div class="admin-logo"><i class="fas fa-paw"></i>Pearl Safari</div>
    <div class="admin-nav-label">Main</div>
    <a href="admin-dashboard.html" class="admin-nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
    <div class="admin-nav-label">Manage</div>
    <a href="admin-bookings.html" class="admin-nav-item"><i class="fas fa-calendar-check"></i><span>Bookings</span></a>
    <a href="admin-payments.html" class="admin-nav-item"><i class="fas fa-credit-card"></i><span>Payments</span></a>
    <a href="admin-messages.html" class="admin-nav-item active"><i class="fas fa-envelope"></i><span>Messages</span></a>
    <a href="admin-users.html" class="admin-nav-item"><i class="fas fa-users"></i><span>Users</span></a>
    <div class="admin-nav-label">Settings</div>
    <div class="admin-nav-item admin-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
  </div>

  <div class="admin-main">
    <div class="admin-header">
      <h1><i class="fas fa-envelope"></i> Messages & Inquiries</h1>
    </div>

    <div class="section-card">
      <div class="section-title">All Messages</div>
      <div id="messagesList"></div>
    </div>
  </div>
</div>

<div id="messageModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Message Details</h2>
      <span class="close" onclick="closeModal()">&times;</span>
    </div>
    <div class="modal-body" id="messageBody"></div>
    <div class="modal-footer">
      <button class="btn-small btn-danger" onclick="deleteCurrentMessage()">Delete</button>
      <button class="btn-small" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:5000/api';
  let currentMessageId = null;

  function checkAuth() {
    if (!localStorage.getItem('adminToken')) {
      window.location.href = 'admin-login.html';
    }
  }

  async function loadMessages() {
    try {
      const token = localStorage.getItem('adminToken');
      const response = await fetch(`${API_BASE}/admin/contacts?skip=0&take=100`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) {
        if (response.status === 401 || response.status === 403) window.location.href = 'admin-login.html';
        throw new Error('Failed to load messages');
      }

      const data = await response.json();
      displayMessages(data.contacts);
    } catch (error) {
      console.error('Error:', error);
      alert('Failed to load messages');
    }
  }

  function displayMessages(messages) {
    const container = document.getElementById('messagesList');
    if (!messages || messages.length === 0) {
      container.innerHTML = '<p style="text-align: center; color: var(--text-soft); padding: 2rem;">No messages found</p>';
      return;
    }

    container.innerHTML = messages.map(msg => `
      <div class="message-item ${!msg.isRead ? 'unread' : ''}" onclick="viewMessage(${msg.id})">
        <div class="message-header">
          <div class="message-from">${msg.fullName}</div>
          <div class="message-time">${new Date(msg.createdAt).toLocaleDateString()}</div>
        </div>
        <div class="message-subject">${msg.subject}</div>
        <div class="message-preview">${msg.message.substring(0, 100)}...</div>
      </div>
    `).join('');
  }

  async function viewMessage(messageId) {
    try {
      const token = localStorage.getItem('adminToken');
      const response = await fetch(`${API_BASE}/admin/contacts/${messageId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) throw new Error('Failed to load message');

      const msg = await response.json();
      currentMessageId = msg.id;

      document.getElementById('messageBody').innerHTML = `
        <div style="display: grid; gap: 1rem;">
          <div><strong>Name:</strong> ${msg.fullName}</div>
          <div><strong>Email:</strong> <a href="mailto:${msg.email}">${msg.email}</a></div>
          <div><strong>Phone:</strong> ${msg.phone || 'N/A'}</div>
          <div><strong>Subject:</strong> ${msg.subject}</div>
          <div style="background: var(--cream); padding: 1rem; border-radius: var(--radius-md); border-left: 4px solid var(--gold);">
            <strong>Message:</strong><br><br>
            ${msg.message.replace(/\n/g, '<br>')}
          </div>
          <div><strong>Received:</strong> ${new Date(msg.createdAt).toLocaleString()}</div>
        </div>
      `;
      document.getElementById('messageModal').style.display = 'block';
    } catch (error) {
      alert('Failed to load message');
    }
  }

  async function deleteCurrentMessage() {
    if (!confirm('Delete this message?')) return;
    try {
      const token = localStorage.getItem('adminToken');
      await fetch(`${API_BASE}/admin/contacts/${currentMessageId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      alert('Message deleted');
      closeModal();
      loadMessages();
    } catch (error) {
      alert('Failed to delete message');
    }
  }

  function closeModal() {
    document.getElementById('messageModal').style.display = 'none';
  }

  function logout() {
    if (confirm('Logout?')) {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminUser');
      window.location.href = 'admin-login.html';
    }
  }

  window.onclick = (e) => {
    const modal = document.getElementById('messageModal');
    if (e.target === modal) modal.style.display = 'none';
  }

  checkAuth();
  loadMessages();
</script>

</body>
</html>
